 }catch(error){

const stopWords=new Set('aber auch beim dass denn diese dieser dieses einen einer einem eines einer nicht noch oder sowie über unter wegen werden wurde wurden haben hatte haben kann können seine seine ihre ihre ihnen durch zwischen mehr weniger schon sehr dazu damit davon deren dessen'.split(' '));
function readerWords(text){return (text.match(/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]{3,}/g)||[]).filter(w=>!stopWords.has(w.toLowerCase()))}
function readingAdaptation(n){
 const summary=(n.description||'').trim();
 const title=n.title.trim();
 // This is a language-learning scaffold, not a fabricated news report.
 if(state.level==='B2')return `Thema der Meldung: ${title}.\n\n${summary||'Die Originalquelle enthält keinen ausführlichen Beschreibungstext.'}\n\nBeim Lesen ist es wichtig, zwischen der berichteten Information und der eigenen Meinung zu unterscheiden. Welche Aussage lässt sich direkt aus der Meldung belegen? Welche Fragen bleiben offen? Formuliere die Hauptaussage anschließend mit eigenen Worten.`;
 return `Ausgangspunkt der Lektüre ist die Meldung mit dem Titel „${title}“.\n\n${summary||'Die Originalquelle enthält keinen ausführlichen Beschreibungstext.'}\n\nFür eine differenzierte Einordnung sollte zwischen ausdrücklich genannten Tatsachen, möglichen Interpretationen und noch ungeklärten Fragen unterschieden werden. Welche Schlussfolgerungen sind durch die vorliegenden Angaben gedeckt? Welche zusätzlichen Informationen wären erforderlich, um die Tragweite der Entwicklung zuverlässig zu beurteilen?\n\nFormuliere eine sachliche Zusammenfassung und erörtere anschließend eine denkbare gesellschaftliche, wissenschaftliche oder wirtschaftliche Bedeutung. Kennzeichne eigene Überlegungen ausdrücklich als solche.`;
}
 function readingQuestions(n,isStory){
  const raw=((isStory?n.text:n.description)||'').replace(/\s+/g,' ').trim();
  const sentences=(raw.match(/[^.!?]+(?:[.!?]+|$)/g)||[]).map(x=>x.trim()).filter(x=>x.length>24);
  const headline=n.title||'der Artikel';
  const first=sentences[0]||raw||'Der Kurztext enthält keine überprüfbare Detailinformation.';
  const second=sentences[1]||null;
  const other=[...liveNews,...articles].filter(x=>x.title!==headline);
  const unrelated=other.map(x=>(x.description||x.text||'').replace(/\s+/g,' ').match(/[^.!?]+(?:[.!?]+|$)/)?.[0]?.trim()).filter(x=>x&&x.length>24&&x!==first);
  function make(q,correct,distractors,why,shift=0){
   let choices=[correct,...distractors.filter(Boolean)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
   while(choices.length<3)choices.push('Der Text enthält hierzu keine zusätzlichen belegten Einzelheiten ('+choices.length+').');
   const rotate=shift%3;choices=[...choices.slice(rotate),...choices.slice(0,rotate)];
   return {q,opts:choices,answer:choices.indexOf(correct),why};
  }
  const questions=[];
  questions.push(make('Hauptaussage: Welche Aussage gibt den belegbaren Kern des Kurztextes am besten wieder?',
   first,[unrelated[0]||'Der Text beweist eine vollständig andere Entwicklung.','Die Überschrift allein belegt sämtliche möglichen Folgen des Ereignisses.'],
   'Diese Aussage stammt aus dem vorliegenden Kurztext. Eine umfassendere Zusammenfassung ist nur mit dem vollständigen Originalartikel möglich.',1));
  questions.push(make('Textbelege: Welche Aussage ist anhand des verfügbaren Kurztextes ausdrücklich nachweisbar?',
   second||first,[unrelated[1]||'Alle Beteiligten sind sich über die Folgen einig.','Die langfristigen Auswirkungen sind bereits abschließend bewiesen.'],
   'Beleg im Kurztext: „'+(second||first)+'“',2));
  questions.push(make('Implizite Informationen: Welche Schlussfolgerung ist bei dieser Quellenlage am besten begründet?',
   'Aus dem Kurztext lassen sich nicht automatisch alle Ursachen und Folgen ableiten.',
   ['Die Überschrift allein reicht für eine vollständige Bewertung aus.','Jede plausible Interpretation ist bereits eine bestätigte Tatsache.'],
   'Eine C1-Lektüre unterscheidet belegte Aussagen, mögliche Deutungen und fehlende Informationen.',1));
  const terms=[...new Set((raw.match(/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]{6,}/g)||[]))].filter(w=>!stopWords.has(w.toLowerCase()));
  const term=terms.find(w=>w.length>=9)||terms[0];
  questions.push(term?make('Wortschatz im Kontext: Welche Vorgehensweise erschließt „'+term+'“ am zuverlässigsten?',
   'Die Bedeutung anhand des Satzkontexts prüfen und gegebenenfalls im Wörterbuch nachschlagen.',
   ['Die Bedeutung allein aus der Wortlänge ableiten.','Das Wort unabhängig vom Satz immer gleich übersetzen.'],
   'Prüfe „'+term+'“ im umgebenden Satz. Das Mini-Wörterbuch unterstützt dich bei der Bedeutungserschließung.',2):make('Wortschatz im Kontext: Wie gehst du mit unbekannten Fachbegriffen um?',
   'Kontext prüfen und die Bedeutung anhand einer verlässlichen Quelle verifizieren.',
   ['Unbekannte Wörter grundsätzlich ignorieren.','Die erste spontane Vermutung als sicher ansehen.'],
   'Bedeutungen müssen zum jeweiligen Kontext passen.',2));
  questions.push(make('Kritische Analyse: Was wäre der sinnvollste nächste Schritt für eine fundierte Beurteilung?',
   'Den vollständigen Originalartikel lesen und zentrale Aussagen mit weiteren Quellen abgleichen.',
   ['Aus dem Kurztext zusätzliche Fakten erfinden.','Auf die Prüfung der Quelle verzichten, weil die Überschrift eindeutig klingt.'],
   'Der RSS-Kurztext ist nur ein Ausschnitt. Für eine belastbare Einordnung sind Originalartikel, Kontext und gegebenenfalls weitere Quellen erforderlich.',1));
  return questions;
 }

function renderReadingQuiz(n,key,isStory){
 const questions=readingQuestions(n,isStory);
 const saved=state.readingResults?.[key];
 const html=questions.map((q,i)=>`<div class="quiz-block"><b>${i+1}. ${escapeHtml(q.q)}</b>${q.opts.map((o,j)=>`<button class="option" data-rq="${i}" data-choice="${j}">${escapeHtml(o)}</button>`).join('')}<div class="choice-feedback" id="rqFeedback${i}"></div></div>`).join('');
 document.getElementById('readingQuiz').innerHTML=html+`<div class="row"><button id="gradeReading" class="primary">Antworten auswerten</button><button id="finishReading">✓ Als gelesen markieren</button></div><p id="readingScore" aria-live="polite">${saved?'Bisheriges Ergebnis: '+saved.correct+'/'+questions.length:''}</p>`;
 const answers={};
 document.querySelectorAll('[data-rq]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.rq;answers[i]=+btn.dataset.choice;document.querySelectorAll('[data-rq="'+i+'"]').forEach(b=>b.classList.toggle('active',b===btn));});
 document.getElementById('gradeReading').onclick=()=>{
  let correct=0;
  questions.forEach((q,i)=>{const chosen=answers[i];const good=chosen===q.answer;if(good)correct++;document.getElementById('rqFeedback'+i).innerHTML=chosen===undefined?'<span class="wrong">Bitte beantworten.</span>':`<span class="${good?'correct':'wrong'}">${good?'✓ Richtig':'✗ Nicht richtig'}</span> ${escapeHtml(q.why)}`;});
  document.getElementById('readingScore').textContent='Ergebnis: '+correct+'/'+questions.length+'. '+(Object.keys(answers).length<questions.length?'Bitte beantworte alle fünf Fragen.':'');
  if(Object.keys(answers).length===questions.length){const old=state.readingResults?.[key]?.correct||0;state.readingResults=state.readingResults||{};state.readingResults[key]={correct:Math.max(correct,old),total:questions.length,updated:new Date().toISOString()};if(correct>old)state.scores+=correct-old;save();document.getElementById('scoreCount').textContent=state.scores;}
 };
 document.getElementById('finishReading').onclick=()=>{const id=isStory?state.article:'news:'+n.id;if(!state.completed.includes(id)){state.completed.push(id);save();}document.getElementById('readCount').textContent=state.completed.length;document.getElementById('readingScore').textContent='✓ Als gelesen gespeichert.';};
}
function bindReaderTools(n,text,key,isStory){
 const reader=document.getElementById('readingBody');
 reader.innerHTML=text.split(/\n\s*\n/).map(p=>'<p>'+escapeHtml(p)+'</p>').join('');
 document.getElementById('readAloud').onclick=()=>speakAtSpeed(n.title+'. '+text,readingSpeed);
 document.getElementById('stopAloud').onclick=()=>speechSynthesis.cancel();
 document.getElementById('speechRate').value=String(readingSpeed);
 document.getElementById('speechRate').onchange=e=>{readingSpeed=Number(e.target.value)};
 const dictionary=document.getElementById('readingDictionary');
 const translate=async selection=>{
  selection=selection.trim().replace(/\s+/g,' ').slice(0,90);
  if(!selection){dictionary.textContent='Markiere zuerst ein Wort im Text.';return}
  dictionary.classList.remove('hidden');dictionary.textContent='Übersetzung wird geladen ...';
  try{
   let meaning='';
   if(isStory&&n.vocab){const match=Object.keys(n.vocab).find(w=>w.toLowerCase()===selection.toLowerCase()||w.toLowerCase().replace(/^(die|der|das) /,'')===selection.toLowerCase());if(match)meaning=n.vocab[match]}
   if(!meaning){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(selection)+'&langpair=de%7Cen',{signal:controller.signal});if(!r.ok)throw Error('Translation unavailable');const data=await r.json();meaning=data.responseData?.translatedText||'';}finally{clearTimeout(timer)}}
   if(!meaning)throw Error('No translation');
   dictionary.innerHTML=`<b>${escapeHtml(selection)}</b><p>${escapeHtml(meaning)}</p><button id="saveReadingWord" class="primary">${state.saved.some(w=>w.word.toLowerCase()===selection.toLowerCase())?'✓ Gespeichert':'+ Vokabel speichern'}</button>`;
   document.getElementById('saveReadingWord').onclick=()=>{if(!state.saved.some(w=>w.word.toLowerCase()===selection.toLowerCase())){state.saved.push({word:selection,meaning});save();document.getElementById('wordCount').textContent=state.saved.length;}document.getElementById('saveReadingWord').textContent='✓ Gespeichert';};
  }catch{dictionary.textContent='Übersetzung derzeit nicht verfügbar. Bitte später erneut versuchen.'}
 };
 document.getElementById('translateReading').onclick=()=>translate(window.getSelection()?.toString()||'');
 reader.addEventListener('dblclick',()=>{const selected=window.getSelection()?.toString()||'';if(selected.trim())translate(selected)});
 const draft=document.getElementById('readingWriting');draft.value=readingDrafts[key]||'';
 draft.oninput=()=>readingDrafts[key]=draft.value;
 document.getElementById('checkWritingReading').onclick=()=>{const words=draft.value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('writingReadingFeedback').textContent=words<30?'Du hast '+words+' Wörter geschrieben. Schreibe mindestens 30 Wörter und unterscheide Fakten von eigenen Überlegungen.':'Du hast '+words+' Wörter geschrieben. Prüfe, ob deine Aussagen im Text belegt sind, ob du passende Konnektoren verwendest und ob deine Schlussfolgerungen klar als eigene Überlegungen gekennzeichnet sind. Dies ist keine automatische inhaltliche oder grammatische Bewertung.'};
 renderReadingQuiz(n,key,isStory);
}
function speakAtSpeed(t,rate){if(!('speechSynthesis' in window)){alert('Sprachausgabe wird nicht unterstützt.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=rate;speechSynthesis.speak(u)}
function reading(root){

 document.querySelectorAll('[data-reading-id]').forEach(b=>b.onclick=()=>{if(isLive)newsSelected=b.dataset.readingId;else state.article=Number(b.dataset.readingId.split(':')[1]);save();render()});
 if(!n){document.getElementById('readingContent').innerHTML='<h2>Lesen</h2><p>Es sind noch keine Texte verfügbar. Prüfe die Nachrichtenaktualisierung.</p>';return}
 const key=isLive?'news:'+n.id:'story:'+n.index;

  quiz:[{q:'Was macht den Mann verdächtig?',opts:['Er trägt einen Koffer und wirkt nervös.','Er kauft eine Fahrkarte.','Er liest eine Zeitung.'],a:0},{q:'Was ist Annas Ausgangssituation?',opts:['Sie sitzt im Zug.','Sie befindet sich nachts an einem verlassenen Bahnhof.','Sie wartet zu Hause.'],a:1},{q:'Welche Erzähltechnik erzeugt Spannung?',opts:['Ein ausführlicher Wetterbericht.','Ein bekanntes Ende.','Ungeklärte Motive und rätselhafte Hinweise.'],a:2}]},
 {id:'bibliothek',title:'Die Nachricht in der Bibliothek',author:'Originalgeschichte',genre:'Mystery',kind:'interactive',
  parts:['Mila findet in einem alten Buch eine handschriftliche Nachricht: „Komm morgen um sechs zum Lesesaal.“ Niemand scheint zu wissen, wer sie geschrieben hat. Als sie aufblickt, ist die Bibliothek fast leer.'],

 {id:'entscheidung',title:'Eine schwierige Entscheidung',author:'Originalgeschichte',genre:'Alltag & Beruf',kind:'interactive',
  parts:['Jonas erhält zwei Stellenangebote. Das erste bietet Sicherheit in seiner Heimatstadt, das zweite eine interessante Aufgabe weit entfernt von seiner Familie. Am Abend ruft seine Schwester an und fragt, wie er sich entscheiden wird.'],
  branches:[{label:'Die sichere Stelle annehmen',text:'Jonas unterschreibt den Vertrag in seiner Heimatstadt. Er ist erleichtert, fragt sich jedoch, ob er eine besondere Chance verpasst hat.'},{label:'Das neue Abenteuer wagen',text:'Jonas nimmt das zweite Angebot an. Die Vorfreude ist groß, doch bei der Wohnungssuche wird ihm bewusst, wie viel Veränderung vor ihm liegt.'},{label:'Um mehr Bedenkzeit bitten',text:'Jonas schreibt beiden Unternehmen und bittet um einige Tage. Dadurch kann er die Arbeitsbedingungen genauer vergleichen und mit seiner Familie sprechen.'}],
  vocab:{'Stellenangebote':'job offers','Heimatstadt':'home town','Bedenkzeit':'time to think','Arbeitsbedingungen':'working conditions','erleichtert':'relieved'},

{"id": "hans", "title": "Hänsel und Gretel", "author": "Nach den Brüdern Grimm", "genre": "Märchen", "kind": "literature", "parts": ["Als die Vorräte knapp werden, geraten Hänsel und Gretel in eine gefährliche Lage. Im Wald verlieren die Geschwister die Orientierung. Hänsel versucht, den Weg mit kleinen Steinen zu markieren, doch beim zweiten Ausflug bleiben ihm nur Brotkrumen.", "Die Vögel fressen die Krumen, und die Kinder finden nicht mehr nach Hause. Schließlich entdecken sie ein Häuschen, das aus süßen Leckereien zu bestehen scheint. Die freundliche Bewohnerin bietet ihnen Schutz an, verfolgt aber einen grausamen Plan.", "Gretel erkennt die Gefahr und handelt entschlossen. Gemeinsam entkommen die Geschwister und finden schließlich zurück. Das Märchen stellt die Frage, wie Mut und Zusammenhalt helfen können, wenn Erwachsene ihre Verantwortung nicht wahrnehmen."], "vocab": {}, "quiz": [{"q": "Warum verlieren die Kinder den Rückweg?", "opts": ["Weil die Vögel die Brotkrumen fressen.", "Weil sie eine Karte verlieren.", "Weil der Wald gesperrt ist."], "a": 0}, {"q": "Welche Gefahr verbirgt das Häuschen?", "opts": ["Ein Unwetter.", "Die Bewohnerin verfolgt einen grausamen Plan.", "Ein wilder Hund."], "a": 1}, {"q": "Was ermöglicht den Geschwistern die Flucht?", "opts": ["Ein fremder König.", "Ein Zauberspruch.", "Mut und Zusammenarbeit."], "a": 2}]},
{"id": "schimmel", "title": "Der Schimmelreiter", "author": "Nach Theodor Storm", "genre": "Novelle", "kind": "literature", "parts": ["Hauke Haien wächst an der norddeutschen Küste auf. Schon früh beobachtet er die Deiche und rechnet aus, wie sie sich besser gegen Sturmfluten sichern ließen. Seine Ideen stoßen auf Widerstand, weil viele Dorfbewohner an überlieferten Methoden festhalten.", "Als Hauke Verantwortung für den Deichbau übernimmt, lässt er neue Bauweisen umsetzen. Die Arbeit ist mühsam und teuer. Einige Bewohner misstrauen ihm und verbreiten Geschichten über seinen auffälligen Schimmel.", "Ein schwerer Sturm stellt den Deich auf die Probe. Die Novelle verbindet die Frage nach technischem Fortschritt mit der Verantwortung eines Einzelnen gegenüber einer Gemeinschaft, die zwischen Erfahrung, Angst und Veränderung steht."], "vocab": {}, "quiz": [{"q": "Womit beschäftigt sich Hauke schon früh?", "opts": ["Mit dem Bau von Schiffen.", "Mit dem Schutz durch bessere Deiche.", "Mit dem Handel von Pferden."], "a": 1}, {"q": "Warum stoßen seine Pläne auf Widerstand?", "opts": ["Weil die Dorfbewohner neue Methoden misstrauisch sehen.", "Weil es an der Küste nie stürmt.", "Weil Hauke keine Ideen hat."], "a": 0}, {"q": "Welches Spannungsfeld prägt die Geschichte?", "opts": ["Kunst und Musik.", "Stadt und Land.", "Fortschritt und gesellschaftliche Verantwortung."], "a": 2}]},
{"id": "sandmann", "title": "Der Sandmann", "author": "Nach E. T. A. Hoffmann", "genre": "Romantik", "kind": "literature", "parts": ["Nathanael erinnert sich an eine unheimliche Gestalt aus seiner Kindheit. Die Erzählungen über den Sandmann haben seine Fantasie geprägt. Als er Jahre später einem fremden Händler begegnet, glaubt er, eine Verbindung zu dieser alten Angst zu erkennen.", "Seine Verlobte Clara versucht, seine Befürchtungen nüchtern einzuordnen. Nathanael hingegen verliert sich zunehmend in Verdächtigungen und rätselhaften Beobachtungen. Auch seine Begegnung mit Olimpia lässt offen, ob er einen Menschen oder nur ein Bild seiner Sehnsucht sieht.", "Die Geschichte spielt mit der Unsicherheit zwischen Wahrnehmung und Wirklichkeit. Sie fragt, wie Erinnerungen, Ängste und Erwartungen bestimmen, was Menschen für wahr halten."], "vocab": {}, "quiz": [{"q": "Was prägt Nathanaels Wahrnehmung?", "opts": ["Seine Kindheitserinnerungen.", "Seine Reiseberichte.", "Sein Studium der Medizin."], "a": 0}, {"q": "Wie reagiert Clara auf seine Ängste?", "opts": ["Sie verstärkt jede Vermutung.", "Sie versucht, die Lage sachlich zu betrachten.", "Sie verlässt sofort die Stadt."], "a": 1}, {"q": "Welches Thema steht im Mittelpunkt?", "opts": ["Die Geschichte einer Erfindung.", "Die Geschichte eines Krieges.", "Die Grenze zwischen Wahrnehmung und Wirklichkeit."], "a": 2}]},
{"id": "kleider", "title": "Des Kaisers neue Kleider", "author": "Nach Hans Christian Andersen", "genre": "Märchen", "kind": "literature", "parts": ["Ein Kaiser liebt prächtige Kleidung mehr als seine Aufgaben. Zwei Betrüger behaupten, sie könnten einen Stoff weben, den nur kluge Menschen sehen. Niemand möchte zugeben, dass er nichts erkennt.", "Minister und Hofleute loben den angeblichen Stoff, obwohl sie vor leeren Webstühlen stehen. Auch der Kaiser spielt mit, weil er fürchtet, als ungeeignet zu gelten. Schließlich zieht er in den vermeintlich neuen Kleidern durch die Stadt.", "Erst ein Kind spricht offen aus, was alle sehen. Die Geschichte zeigt, wie Gruppendruck, Eitelkeit und die Angst vor Gesichtsverlust Menschen dazu bringen können, eine offensichtliche Unwahrheit zu bestätigen."], "vocab": {}, "quiz": [{"q": "Was behaupten die Betrüger?", "opts": ["Der Stoff sei unsichtbar für unkluge Menschen.", "Der Stoff sei besonders warm.", "Der Stoff komme aus Gold."], "a": 0}, {"q": "Warum schweigen die Hofleute?", "opts": ["Sie haben den Stoff bereits gekauft.", "Sie fürchten, als unklug zu gelten.", "Sie haben keine Zeit."], "a": 1}, {"q": "Welche Rolle spielt das Kind?", "opts": ["Es bestätigt die Betrüger.", "Es verlässt die Stadt.", "Es benennt offen die Wahrheit."], "a": 2}]},
{"id": "labor", "title": "Die verschwundene Probe", "author": "Originalgeschichte", "genre": "Wissenschaftskrimi", "kind": "interactive", "parts": ["Am Montagmorgen entdeckt die Biologin Lea, dass eine wichtige Forschungsprobe aus dem Kühlschrank verschwunden ist. Im digitalen Laborbuch wurde die Entnahme nicht dokumentiert. Die Analyse soll am Nachmittag beginnen.", "Auf dem Tisch liegt ein Zettel mit einer unvollständigen Probennummer. Gleichzeitig meldet die Zugangskontrolle einen nächtlichen Zutritt. Lea weiß, dass sie vorschnelle Anschuldigungen vermeiden muss."], "vocab": {}, "quiz": [{"q": "Was fehlt zu Beginn?", "opts": ["Die Dokumentation der Entnahme.", "Ein neues Mikroskop.", "Ein Reiseantrag."], "a": 0}, {"q": "Warum sollte Lea nicht vorschnell urteilen?", "opts": ["Weil alle bereits informiert sind.", "Weil mehrere Erklärungen möglich sind.", "Weil die Probe unwichtig ist."], "a": 1}, {"q": "Was ist für die Qualität der Forschung entscheidend?", "opts": ["Möglichst schnelles Raten.", "Vertrauliche Gespräche ohne Protokoll.", "Nachvollziehbare Dokumentation und Prüfung."], "a": 2}], "branches": [{"label": "Zuerst das Laborbuch überprüfen", "text": "Lea vergleicht Zeitstempel und Inventarliste. Dabei entdeckt sie eine falsch beschriftete Ersatzbox. Sie lässt die Identität der Probe unabhängig überprüfen, bevor sie die Analyse freigibt."}, {"label": "Die zuständige Person anrufen", "text": "Die Kollegin erklärt, dass eine Kühlstörung aufgetreten sei und Proben vorsorglich umgelagert wurden. Lea fordert die vollständige Dokumentation an, statt sich allein auf die mündliche Erklärung zu verlassen."}, {"label": "Den Vorfall dokumentieren", "text": "Lea sichert die vorhandenen Informationen und informiert die Laborleitung. Gemeinsam rekonstruieren sie die Lagerbedingungen und entscheiden, die betroffene Probe bis zur Klärung nicht zu verwenden."}]},
{"id": "wohnung", "title": "Das Zimmer in Köln", "author": "Originalgeschichte", "genre": "Alltag & Entscheidung", "kind": "interactive", "parts": ["Samira beginnt in zwei Wochen eine Weiterbildung in Köln. Sie hat ein günstiges Zimmer gefunden, doch der Vermieter möchte die Kaution sofort per Überweisung erhalten. Eine Besichtigung hat noch nicht stattgefunden.", "Die Fotos sehen überzeugend aus, aber einige Angaben in der Nachricht widersprechen sich. Samira muss entscheiden, wie sie mit dem Angebot umgeht."], "vocab": {}, "quiz": [{"q": "Warum ist Samira vorsichtig?", "opts": ["Die Lage ist zu zentral.", "Es gibt Widersprüche und keine Besichtigung.", "Das Zimmer ist möbliert."], "a": 1}, {"q": "Welche Information fehlt?", "opts": ["Die Farbe der Wände.", "Die Öffnungszeiten der Bibliothek.", "Verlässliche Vertrags- und Vermieterangaben."], "a": 2}, {"q": "Was ist eine angemessene Reaktion?", "opts": ["Vor der Zahlung Informationen prüfen.", "Die Kaution sofort überweisen.", "Alle Nachrichten ignorieren."], "a": 0}], "branches": [{"label": "Eine Besichtigung vereinbaren", "text": "Samira bittet um eine Besichtigung und einen schriftlichen Mietvertrag. Der Vermieter weicht ihren Fragen aus. Sie entscheidet, kein Geld zu überweisen, bevor die Angaben überprüft sind."}, {"label": "Die Unterlagen überprüfen", "text": "Samira kontrolliert die Adresse, fragt nach den Vertragsbedingungen und vergleicht die Angaben mit der Anzeige. Als Unstimmigkeiten bleiben, fordert sie weitere Nachweise an."}, {"label": "Ein anderes Angebot suchen", "text": "Samira verzichtet auf die unsichere Zusage und kontaktiert eine seriöse Wohnungsvermittlung. Das neue Zimmer ist etwas teurer, aber sie kann es persönlich besichtigen."}]},
{"id": "zug", "title": "Der letzte Zug nach Berlin", "author": "Originalgeschichte", "genre": "Abenteuer", "kind": "interactive", "parts": ["Tobias sitzt im letzten Zug nach Berlin, als die Durchsage plötzlich eine ungeplante Streckensperrung meldet. Der Zug hält an einem kleinen Bahnhof. Sein Vorstellungsgespräch beginnt am nächsten Morgen um neun.", "Auf dem Bahnsteig diskutieren Reisende über verschiedene Möglichkeiten. Tobias hat nur noch wenig Akku und muss eine Entscheidung treffen."], "vocab": {}, "quiz": [{"q": "Warum steht Tobias unter Zeitdruck?", "opts": ["Er hat seinen Ausweis verloren.", "Er muss morgen zu einem Vorstellungsgespräch.", "Er wartet auf ein Paket."], "a": 1}, {"q": "Welche Schwierigkeit kommt hinzu?", "opts": ["Sein Akku ist fast leer.", "Er hat kein Gepäck.", "Er kennt den Bahnhof gut."], "a": 0}, {"q": "Was zeigt die zweite Entscheidung?", "opts": ["Dass Kommunikation eine Alternative eröffnen kann.", "Dass man nie nachfragen sollte.", "Dass Züge immer pünktlich sind."], "a": 0}], "branches": [{"label": "Die Verbindung prüfen", "text": "Tobias lädt die Fahrplanauskunft und findet eine Verbindung über eine andere Strecke. Er prüft die Umsteigezeit und reserviert vorsorglich eine Unterkunft für die Nacht."}, {"label": "Den Arbeitgeber informieren", "text": "Tobias schreibt eine kurze, sachliche Nachricht und erklärt die Situation. Das Unternehmen bietet ihm ein Videogespräch an. Er ist erleichtert, weil seine Offenheit eine Lösung ermöglicht hat."}, {"label": "Mit Reisenden eine Alternative suchen", "text": "Tobias fragt am Informationsschalter nach einer offiziellen Ersatzverbindung. Gemeinsam mit anderen Fahrgästen findet er einen Anschlussbus, dessen Ankunft jedoch ungewiss bleibt."}]},
{"id": "archiv", "title": "Die Akte ohne Namen", "author": "Originalgeschichte", "genre": "Rätsel", "kind": "interactive", "parts": ["Bei der Digitalisierung eines Stadtarchivs findet Nora eine Akte ohne Namen. Darin liegen ein alter Stadtplan und ein Brief, der auf ein Gebäude verweist, das längst abgerissen wurde.", "Auf der Rückseite des Plans steht eine Zahlenfolge. Eine Kollegin meint, es handle sich um eine alte Registriernummer. Nora vermutet jedoch einen Hinweis auf einen bislang unbekannten Bestand."], "vocab": {}, "quiz": [{"q": "Was findet Nora?", "opts": ["Eine namenlose Akte mit Plan und Brief.", "Einen neuen Computer.", "Ein aktuelles Telefonbuch."], "a": 0}, {"q": "Warum ist die Zahlenfolge interessant?", "opts": ["Sie könnte auf einen Archivbestand verweisen.", "Sie ist eine Telefonnummer.", "Sie ist offensichtlich bedeutungslos."], "a": 0}, {"q": "Welche Vorgehensweise ist angemessen?", "opts": ["Die Akte wegwerfen.", "Den Fund geheim halten.", "Hinweise systematisch prüfen und dokumentieren."], "a": 2}], "branches": [{"label": "Die Archivsignatur prüfen", "text": "Nora durchsucht den Katalog nach ähnlichen Nummern. Schließlich findet sie eine verknüpfte Akte, die den Ursprung des Briefes erklärt. Sie dokumentiert die neue Zuordnung."}, {"label": "Den historischen Stadtplan vergleichen", "text": "Nora legt den alten Plan neben eine aktuelle Karte. Sie erkennt, dass eine Straße umbenannt wurde und das gesuchte Gebäude an einem anderen Ort stand als zunächst angenommen."}, {"label": "Die Kollegin um Hilfe bitten", "text": "Gemeinsam prüfen Nora und ihre Kollegin mehrere Hypothesen. Die Zahlenfolge gehört zu einer früheren Inventarliste. Sie finden den zugehörigen Eintrag und korrigieren die Metadaten."}]}
];
function litText(work){const parts=work.parts; if(state.level==='B1')return parts.map(p=>p.replace(/, (damit|obwohl|während|dass) /gi,'. ')).join('\n\n');if(state.level==='B2')return parts.join('\n\n');return parts.join('\n\n')+'\n\nReflektiere, inwiefern die Figuren unter dem Einfluss von Erwartungen, Unsicherheit oder gesellschaftlichen Normen handeln. Unterscheide dabei ausdrücklich zwischen Textbelegen und deiner eigenen Interpretation.'}
function literatureReading(root){
 const interactive=state.readMode==='interactive';const works=literatureWorks.filter(x=>x.kind===(interactive?'interactive':'literature'));
 const work=works.find(x=>x.id===state.literatureId)||works[0];const key='lit:'+work.id+':'+state.level;
 const branch=state.storyPaths?.[work.id];const branchText=interactive&&branch!==undefined?work.branches[branch]?.text:'';
 root.innerHTML=`<div class="grid"><section class="panel"><h2>Lesen · Literatur & Geschichten</h2><div class="row"><button id="litNews">📰 Nachrichten</button><button id="litClassic" class="${!interactive?'primary':''}">📚 Literatur</button><button id="litInteractive" class="${interactive?'primary':''}">🎭 Interaktiv</button></div><label for="litLevel">Sprachniveau</label><select class="field" id="litLevel"><option>B1</option><option>B2</option><option>C1</option></select><p class="muted">${interactive?'Deine Entscheidungen verändern den Fortgang der Geschichte.':'Eigene Nacherzählungen gemeinfreier Klassiker, keine wörtlichen Originaltexte.'}</p><div class="articles">${works.map(w=>`<button class="articleBtn ${work.id===w.id?'active':''} ${state.completed.includes('lit:'+w.id+':'+state.level)?'done':''}" data-lit="${w.id}"><strong>${escapeHtml(w.title)}</strong><small>${escapeHtml(w.author)} · ${escapeHtml(w.genre)}</small></button>`).join('')}</div></section><section class="panel"><div class="row between"><span class="tag">${escapeHtml(work.genre)}</span><span class="tag">${state.level}</span></div><h2>${escapeHtml(work.title)}</h2><p class="muted">${escapeHtml(work.author)}</p><div class="reader" id="readingBody"></div>${interactive?`<div class="question"><h3>Wie soll es weitergehen?</h3>${work.branches.map((b,i)=>`<button class="option ${branch===i?'active':''}" data-branch="${i}">${escapeHtml(b.label)}</button>`).join('')}<p class="muted">Du kannst eine andere Entscheidung ausprobieren.</p></div>`:''}<p class="muted">Markiere ein Wort und klicke auf „Wort übersetzen“, oder doppelklicke auf ein Wort.</p><div class="reader-tools"><button id="translateReading">🔎 Wort übersetzen</button><button id="readAloud">🔊 Vorlesen</button><button id="stopAloud">■ Stopp</button><label for="speechRate">Tempo</label><select id="speechRate"><option value="0.7">Langsam</option><option value="0.85">Normal</option><option value="1">Schnell</option></select></div><div id="readingDictionary" class="dict hidden"></div><div class="question"><h3>Leseverständnis · 3 Aufgaben</h3><div id="readingQuiz"></div></div><div class="question"><h3>Schreibaufgabe · ${state.level}</h3><p>${state.level==='B1'?'Beschreibe die Hauptfigur in drei bis fünf Sätzen.':state.level==='B2'?'Erkläre die Entscheidung einer Figur und begründe deine Meinung.':'Analysiere die Motive einer Figur und erläutere, wie die Erzählweise die Wirkung der Geschichte beeinflusst.'}</p><textarea id="readingWriting" class="field" placeholder="Meiner Ansicht nach ..."></textarea><button id="checkWritingReading">Schreibaufgabe prüfen</button><p id="writingReadingFeedback" class="muted"></p></div></section></div>`;
 document.getElementById('litLevel').value=state.level;
 document.getElementById('litLevel').onchange=e=>{state.level=e.target.value;save();render()};
 document.getElementById('litNews').onclick=()=>{state.readMode='news';save();render();if(!newsAttempted)loadNews()};
 document.getElementById('litClassic').onclick=()=>{state.readMode='literature';save();render()};
 document.getElementById('litInteractive').onclick=()=>{state.readMode='interactive';save();render()};
 document.querySelectorAll('[data-lit]').forEach(b=>b.onclick=()=>{state.literatureId=b.dataset.lit;save();render()});
 document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{state.storyPaths=state.storyPaths||{};state.storyPaths[work.id]=+b.dataset.branch;save();render()});
 const text=litText(work)+(branchText?'\n\n'+branchText:'');
 bindReaderTools(work,text,key,true);
 const quiz=document.getElementById('readingQuiz');const answers={};const previous=state.readingResults?.[key];
 quiz.innerHTML=work.quiz.map((q,i)=>`<div class="quiz-block"><b>${i+1}. ${escapeHtml(q.q)}</b>${q.opts.map((opt,j)=>`<button class="option" data-lq="${i}" data-lchoice="${j}">${escapeHtml(opt)}</button>`).join('')}<div id="lfeedback${i}" class="choice-feedback"></div></div>`).join('')+`<div class="row"><button class="primary" id="gradeLit">Antworten prüfen</button><button id="finishLit">✓ Als gelesen markieren</button></div><p id="litScore" aria-live="polite">${previous?'Bisheriges Ergebnis: '+previous.correct+'/3':''}</p>`;
 document.querySelectorAll('[data-lq]').forEach(b=>b.onclick=()=>{let i=+b.dataset.lq;answers[i]=+b.dataset.lchoice;document.querySelectorAll('[data-lq="'+i+'"]').forEach(x=>x.classList.toggle('active',x===b))});
 document.getElementById('gradeLit').onclick=()=>{let correct=0;work.quiz.forEach((q,i)=>{if(answers[i]===q.a)correct++;document.getElementById('lfeedback'+i).textContent=answers[i]===undefined?'Bitte beantworten.':answers[i]===q.a?'✓ Richtig!':'Nicht richtig. Richtige Antwort: '+q.opts[q.a]});document.getElementById('litScore').textContent='Ergebnis: '+correct+'/3';if(Object.keys(answers).length===3){state.readingResults=state.readingResults||{};let old=state.readingResults[key]?.correct||0;state.readingResults[key]={correct:Math.max(old,correct),total:3,updated:new Date().toISOString()};state.scores+=Math.max(0,correct-old);save();document.getElementById('scoreCount').textContent=state.scores}};
 document.getElementById('finishLit').onclick=()=>{if(interactive&&branch===undefined){document.getElementById('litScore').textContent='Wähle zuerst eine Entscheidung in der Geschichte.';return}if(!state.completed.includes(key)){state.completed.push(key);save()}document.getElementById('readCount').textContent=state.completed.length;document.getElementById('litScore').textContent='✓ Als gelesen gespeichert.'};
}

let grammarLevel=state.level,grammarLessonId=null,grammarQuestionIndex=0,grammarCorrect=0,grammarAnswered=false;
function grammar(root){
 const available=grammarLessons.filter(x=>x.level===grammarLevel);
 const current=available.find(x=>x.id===grammarLessonId);
 const done=state.grammarCompleted||{};
 root.innerHTML=`<section class="panel"><h2>📘 Grammatik-Akademie</h2><p class="muted">Lerne Schritt für Schritt: Erklärung, Beispiel und Übung. Dein Fortschritt wird gespeichert.</p><div class="row" style="gap:9px;margin:16px 0">${['B1','B2','C1'].map(l=>`<button data-grammar-level="${l}" class="${grammarLevel===l?'primary':''}">${l}</button>`).join('')}</div><p class="muted">${available.filter(x=>done[x.id]).length} von ${available.length} Lektionen abgeschlossen auf ${grammarLevel}</p><div class="lesson-grid">${available.map(x=>`<button class="lesson-card ${current?.id===x.id?'chosen':''}" data-lesson="${x.id}"><span class="tag">${x.level}</span><strong>${escapeHtml(x.title)}</strong><small>${done[x.id]?'✓ Abgeschlossen':'Lektion öffnen'}</small></button>`).join('')}</div><div id="grammarContent"></div></section>`;
 root.querySelectorAll('[data-grammar-level]').forEach(b=>b.onclick=()=>{grammarLevel=b.dataset.grammarLevel;grammarLessonId=null;grammarQuestionIndex=0;grammar(root)});
 root.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{grammarLessonId=b.dataset.lesson;grammarQuestionIndex=0;grammarCorrect=0;grammarAnswered=false;grammar(root)});
 if(!current){root.querySelector('#grammarContent').innerHTML='<div class="lesson-detail"><h3>Wähle eine Lektion</h3><p>Beginne mit einem Thema oben. Jede Lektion enthält eine kurze Erklärung und eine Übung mit direktem Feedback.</p></div>';return}
 const q=current.questions[grammarQuestionIndex];
 const detail=root.querySelector('#grammarContent');
 detail.innerHTML=`<div class="lesson-detail"><span class="tag">${current.level} · Lektion</span><h3>${escapeHtml(current.title)}</h3><p>${escapeHtml(current.theory)}</p><div class="grammar-example"><b>Beispiele</b><p>${escapeHtml(current.example).replaceAll(' | ','<br>')}</p></div><h3>✏️ Übung ${grammarQuestionIndex+1} von ${current.questions.length}</h3><p>${escapeHtml(q.q)}</p><div class="grammar-answers">${q.opts.map((o,i)=>`<button data-lesson-answer="${i}">${escapeHtml(o)}</button>`).join('')}</div><div id="lessonFeedback" aria-live="polite"></div><button class="primary" id="grammarNext" style="margin-top:12px" disabled>Weiter</button></div>`;
 detail.querySelectorAll('[data-lesson-answer]').forEach(b=>b.onclick=()=>{
  if(grammarAnswered)return;
  grammarAnswered=true;
  const correct=Number(b.dataset.lessonAnswer)===q.answer;
  if(correct){grammarCorrect++;state.scores++}
  state.attempts++;save();document.getElementById('scoreCount').textContent=state.scores;
  detail.querySelector('#lessonFeedback').innerHTML=`<p class="${correct?'correct':'wrong'}"><b>${correct?'✓ Richtig!':'Noch nicht richtig.'}</b> ${escapeHtml(q.why)}</p>`;
  detail.querySelectorAll('[data-lesson-answer]').forEach(x=>{x.disabled=true;if(Number(x.dataset.lessonAnswer)===q.answer)x.classList.add('right-answer')});
  detail.querySelector('#grammarNext').disabled=false;
 });
 detail.querySelector('#grammarNext').onclick=()=>{
  if(grammarQuestionIndex+1<current.questions.length){grammarQuestionIndex++;grammarAnswered=false;grammar(root)}
  else{state.grammarCompleted=state.grammarCompleted||{};state.grammarCompleted[current.id]=true;save();grammarLessonId=null;grammar(root)}
 };
}
function progress(root){root.innerHTML=`<section class="panel"><h2>Mein Lernfortschritt</h2><p><b>${state.completed.filter(x=>typeof x==='number').length} / ${articles.length}</b> Lerngeschichten abgeschlossen · <b>${state.completed.filter(x=>typeof x==='string'&&x.startsWith('lit:')).length}</b> Literaturtexte / interaktive Geschichten abgeschlossen · ${state.completed.filter(x=>typeof x==='string'&&x.startsWith('news:')).length} Nachrichten gelesen</p><progress value="${state.completed.filter(x=>typeof x==='number').length}" max="${articles.length}" style="width:100%"></progress><p><b>${state.saved.length}</b> Vokabeln gespeichert · <b>${state.scores}</b> richtige Antworten</p><label for="notes">Meine Lernnotizen</label><textarea class="field" id="notes" placeholder="Was möchte ich morgen wiederholen?">${escapeHtml(state.notes)}</textarea><h3>Datensicherung</h3><p class="muted">Exportiere deine Daten, um sie auf ein anderes Gerät zu übertragen oder vor dem Löschen von Browserdaten zu sichern.</p><div class="row"><button id="export" class="primary">Daten exportieren</button><label for="import" style="margin:0"><span class="tag">Daten importieren</span></label><input type="file" id="import" accept="application/json" style="max-width:180px"><button id="reset">Fortschritt zurücksetzen</button></div></section>`;document.getElementById('notes').oninput=e=>{state.notes=e.target.value;save()};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutsch-lernen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.saved)||!Array.isArray(d.completed))throw Error('Ungültige Sicherungsdatei');state={...initial,...d};save();render();alert('Daten importiert.')}catch{alert('Diese Datei konnte nicht importiert werden.')}};document.getElementById('reset').onclick=()=>{if(confirm('Wirklich alle lokalen Lerndaten löschen?')){state={...initial};save();render()}}}
render();
// Refresh the deployed news.json once per day when the app is opened or revisited.
let lastNewsRefreshDay='';
function refreshDailyNews(){
 const today=new Date().toLocaleDateString('en-CA');
 if(today!==lastNewsRefreshDay){lastNewsRefreshDay=today;loadNews(true)}
}
refreshDailyNews();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDailyNews()});
window.addEventListener('focus',refreshDailyNews);
</script></body></html>
