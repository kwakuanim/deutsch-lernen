function readingAdaptation(n){
 const summary=(n.description||'').trim();

 // This is a language-learning scaffold, not a fabricated news report.
 if(state.level==='B2')return `Thema der Meldung: ${title}.\n\n${summary||'Die Originalquelle enthält keinen ausführlichen Beschreibungstext.'}\n\nBeim Lesen ist es wichtig, zwischen der berichteten Information und der eigenen Meinung zu unterscheiden. Welche Aussage lässt sich direkt aus der Meldung belegen? Welche Fragen bleiben offen? Formuliere die Hauptaussage anschließend mit eigenen Worten.`;

}
function readingQuestions(n,isStory){
 // All correct factual answers are extracted from the displayed source text.
 // Other headlines are distractors, never presented as facts about this article.
 const raw=(isStory?n.text:n.description)||'';
 const sentences=raw.replace(/\s+/g,' ').trim().match(/[^.!?]+(?:[.!?]+|$)/g)?.map(x=>x.trim()).filter(x=>x.length>24)||[];
 const otherTitles=[...liveNews,...articles].filter(x=>x.title&&x.title!==n.title).map(x=>x.title);
 const otherSentences=[...liveNews,...articles].filter(x=>x.title!==n.title).flatMap(x=>((x.description||x.text||'').match(/[^.!?]+(?:[.!?]+|$)/g)||[]).map(v=>v.trim()).filter(v=>v.length>25));
 function options(correct,wrong,q,why,shift=0){
  const pool=[correct,...wrong.filter(x=>x&&x!==correct)].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
  while(pool.length<3)pool.push('Diese Information ist im vorliegenden Kurztext nicht enthalten ('+pool.length+').');
  const turn=shift%3;const opts=[...pool.slice(turn),...pool.slice(0,turn)];
  return {q,opts,answer:opts.indexOf(correct),why};
 }
 const questions=[];
 questions.push(options(n.title,otherTitles.slice(0,2).concat(['Ein anderes Thema ohne Bezug zum Text']),
  'Welche Überschrift gehört zu dem gelesenen Artikel?',
  'Die Überschrift des ausgewählten Artikels lautet: „'+n.title+'“.',1));
 if(sentences.length){
  questions.push(options(sentences[0],otherSentences.slice(0,2),
   'Welche Aussage steht ausdrücklich im gelesenen Text?',
   'Diese Aussage ist wörtlich im Kurztext enthalten: „'+sentences[0]+'“',2));
 }else{
  questions.push(options(n.category,['Sport','Reisen'],
   'Welchem Themenbereich ist dieser Artikel zugeordnet?',
   'Die Meldung ist unter „'+n.category+'“ eingeordnet.',2));
 }
 if(sentences.length>=2){
  questions.push(options(sentences[1],otherSentences.filter(x=>x!==sentences[0]).slice(2,4).concat(otherSentences.slice(0,2)),
   'Welche weitere Information wird im Text genannt?',
   'Im zweiten Satz steht: „'+sentences[1]+'“',1));
 }else if(sentences.length){
  questions.push(options(sentences[0],['Der Text enthält eine vollständige wissenschaftliche Studie.','Die Meldung nennt ausdrücklich keine Fakten.'],
   'Welche Formulierung lässt sich anhand des Kurztextes belegen?',
   'Der vorliegende Kurztext enthält diese Formulierung.',1));
 }else{
  questions.push(options(n.title,otherTitles.slice(2,4),
   'Welche Nachricht hast du ausgewählt?',
   'Die Überschrift ist direkt über dem Lesetext angegeben.',1));
 }
 const word=(raw.match(/\b[A-ZÄÖÜ][a-zäöüß]{6,}\b/g)||[]).find(w=>!['Deutschland','Allerdings','Während'].includes(w));
 if(word){
  questions.push(options(word,['ein im Text nicht genanntes Fachwort','eine nicht belegte Behauptung'],
   'Welcher dieser Ausdrücke kommt im Text tatsächlich vor?',
   'Der Ausdruck „'+word+'“ ist im Text enthalten. Seine Bedeutung kannst du im Mini-Wörterbuch nachschlagen.',2));
 }else{
  questions.push(options(n.source,['Eine anonyme private Nachricht','Ein unbekannter Kommentar'],
   'Welche Quelle ist für diesen Text angegeben?',
   'Als Quelle ist „'+n.source+'“ angegeben.',2));
 }
 questions.push(options('Die vollständige Originalquelle öffnen',[
  'Eine zusätzliche Behauptung ohne Beleg erfinden','Nur aus der Überschrift weitere Einzelheiten ableiten'],
  'Wie kannst du weitere Einzelheiten zu genau dieser Meldung zuverlässig nachlesen?',
  'Der Link zum vollständigen Originalartikel steht unter dem Lesetext.',1));
 return questions;
}

function renderReadingQuiz(n,key,isStory){
 const questions=readingQuestions(n,isStory);
 const saved=state.readingResults?.[key];
 const html=questions.map((q,i)=>`<div class="quiz-block"><b>${i+1}. ${escapeHtml(q.q)}</b>${q.opts.map((o,j)=>`<button class="option" data-rq="${i}" data-choice="${j}">${escapeHtml(o)}</button>`).join('')}<div class="choice-feedback" id="rqFeedback${i}"></div></div>`).join('');
 document.getElementById('readingQuiz').innerHTML=html+`<div class="row"><button id="gradeReading" class="primary">Antworten auswerten</button><button id="finishReading">✓ Als gelesen markieren</button></div><p id="readingScore" aria-live="polite">${saved?'Bisheriges Ergebnis: '+saved.correct+'/5':''}</p>`;
 const answers={};
 document.querySelectorAll('[data-rq]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.rq;answers[i]=+btn.dataset.choice;document.querySelectorAll('[data-rq="'+i+'"]').forEach(b=>b.classList.toggle('active',b===btn));});
 document.getElementById('gradeReading').onclick=()=>{
  let correct=0;

speechStatus').textContent=String(e)}};document.getElementById('stopListening').onclick=()=>{recognition?.stop();document.getElementById('speechStatus').textContent='Aufnahme beendet.'}}
const exercises=[{q:'Wenn ich mehr Zeit ___, würde ich jeden Tag Deutsch üben.',opts:['habe','hätte','hatte'],answer:1,why:'Konjunktiv II: „Wenn ich mehr Zeit hätte, würde ich ...“'},{q:'Die Studie, ___ Ergebnisse veröffentlicht wurden, ist sehr relevant.',opts:['deren','dessen','denen'],answer:0,why:'Genitiv-Relativpronomen für „die Studie“: deren.'},{q:'Die Daten ___ gestern ausgewertet.',opts:['wurden','werden sein','hat'],answer:0,why:'Präteritum Passiv: wurden + Partizip II.'},{q:'Trotz ___ hohen Kosten wurde das Projekt fortgesetzt.',opts:['die','der','den'],answer:1,why:'„Trotz“ steht im Standarddeutsch mit Genitiv: trotz der hohen Kosten.'},{q:'Er behauptet, er ___ die Ergebnisse bereits überprüft.',opts:['habe','hatte sein','wären'],answer:0,why:'Indirekte Rede im Konjunktiv I: er habe überprüft.'}];function grammar(root){let e=exercises[quizIndex%exercises.length];root.innerHTML=`<section class="panel"><h2>Grammatiktrainer</h2><p class="muted">Konjunktiv II · Relativsätze · Passiv · Genitiv · indirekte Rede</p><span class="tag">Aufgabe ${quizIndex%exercises.length+1} von ${exercises.length}</span><div class="question"><h3>${e.q}</h3>${e.opts.map((o,i)=>`<button class="option" data-grammar="${i}">${o}</button>`).join('')}<p id="grammarFeedback" aria-live="polite"></p><button id="nextGrammar" class="primary" disabled>Nächste Aufgabe</button></div></section>`;document.querySelectorAll('[data-grammar]').forEach(b=>b.onclick=()=>{let good=Number(b.dataset.grammar)===e.answer;document.getElementById('grammarFeedback').innerHTML=`<span class="${good?'correct':'wrong'}">${good?'✓ Richtig!':'Nicht ganz.'}</span> ${e.why}`;document.getElementById('nextGrammar').disabled=false;document.querySelectorAll('[data-grammar]').forEach(x=>x.disabled=true);state.attempts++;if(good)state.scores++;save();document.getElementById('scoreCount').textContent=state.scores});document.getElementById('nextGrammar').onclick=()=>{quizIndex++;render()}}
function progress(root){root.innerHTML=`<section class="panel"><h2>Mein Lernfortschritt</h2><p><b>${state.completed.filter(x=>typeof x==='number').length} / ${articles.length}</b> Lerngeschichten abgeschlossen · ${state.completed.filter(x=>typeof x==='string').length} Nachrichten gelesen</p><progress value="${state.completed.filter(x=>typeof x==='number').length}" max="${articles.length}" style="width:100%"></progress><p><b>${state.saved.length}</b> Vokabeln gespeichert · <b>${state.scores}</b> richtige Antworten</p><label for="notes">Meine Lernnotizen</label><textarea class="field" id="notes" placeholder="Was möchte ich morgen wiederholen?">${escapeHtml(state.notes)}</textarea><h3>Datensicherung</h3><p class="muted">Exportiere deine Daten, um sie auf ein anderes Gerät zu übertragen oder vor dem Löschen von Browserdaten zu sichern.</p><div class="row"><button id="export" class="primary">Daten exportieren</button><label for="import" style="margin:0"><span class="tag">Daten importieren</span></label><input type="file" id="import" accept="application/json" style="max-width:180px"><button id="reset">Fortschritt zurücksetzen</button></div></section>`;document.getElementById('notes').oninput=e=>{state.notes=e.target.value;save()};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutsch-lernen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.saved)||!Array.isArray(d.completed))throw Error('Ungültige Sicherungsdatei');state={...initial,...d};save();render();alert('Daten importiert.')}catch{alert('Diese Datei konnte nicht importiert werden.')}};document.getElementById('reset').onclick=()=>{if(confirm('Wirklich alle lokalen Lerndaten löschen?')){state={...initial};save();render()}}}
render();
</script></body></html>
