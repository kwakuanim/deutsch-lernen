<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c52"><title>Deutsch Lernen</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183044;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:18px}.head{background:#123c52;color:white;padding:22px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:#c9e4e8}.pill{background:#e2f3ee;color:#155c4b;border-radius:100px;padding:7px 12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.panel{background:white;border:1px solid #e0e7ee;border-radius:15px;padding:16px}.stat strong{display:block;font-size:24px}.stat small{color:#617487}.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 13px}.nav button{white-space:nowrap}button,select,input,textarea{font:inherit}button{border:1px solid #cad7e0;border-radius:10px;padding:10px 13px;background:white;color:#183044;cursor:pointer}button:hover{background:#edf4f8}.active,.primary{background:#166b82;color:white;border-color:#166b82}.active:hover,.primary:hover{background:#12576a}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.panel h2{margin-top:0;font-size:20px}.muted{color:#63778a;font-size:14px}.articles{display:grid;gap:8px}.articleBtn{text-align:left;width:100%}.articleBtn strong{display:block}.articleBtn small{color:#617487}.reader{font-size:18px;line-height:1.9}.word{border:0;border-bottom:1px dashed #7fa2ad;background:none;padding:0 1px;border-radius:0;font-size:inherit;line-height:inherit;cursor:pointer}.word:hover{background:#e4f3f7}.dict{padding:14px;background:#eaf5f5;border-radius:12px;margin:12px 0}.dict strong{display:block}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.question{background:#f4f8fb;padding:14px;border-radius:12px;margin-top:15px}.option{display:block;width:100%;text-align:left;margin:7px 0}.correct{color:#187247}.wrong{color:#a23b3b}.hidden{display:none!important}.field{width:100%;padding:12px;border:1px solid #cbd8e1;border-radius:10px}textarea{min-height:140px;resize:vertical}.tag{display:inline-block;background:#eef4f7;border-radius:20px;padding:4px 9px;font-size:12px;margin:3px}.vocab{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e4eaf0;padding:10px 0}.note{border-left:3px solid #166b82;padding:10px 14px;background:#f1f7f9;margin:12px 0}.footer{font-size:12px;color:#6a7d8d;padding:20px 0}a{color:#166b82}label{display:block;margin:10px 0 5px}#feedback{white-space:pre-wrap}@media(max-width:700px){.app{padding:10px}.head{padding:17px}.head h1{font-size:21px}.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:21px}.panel{padding:13px}}
</style></head><body><div class="app"><header class="head"><div><h1>📚 Deutsch Lernen</h1><p>Dein persönlicher Sprachtrainer · B2 bis C1</p></div><span class="pill" id="levelBadge">C1</span></header><section class="stats"><div class="stat"><strong id="readCount">0</strong><small>Texte abgeschlossen</small></div><div class="stat"><strong id="wordCount">0</strong><small>Vokabeln gespeichert</small></div><div class="stat"><strong id="scoreCount">0</strong><small>Übungen richtig</small></div></section><nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">Deine Daten bleiben in diesem Browser auf diesem Gerät. Exportiere regelmäßig eine Sicherung. Nachrichtenlinks führen zu externen Webseiten.</div></div><script>
'use strict';const KEY='deutsch-lernen-v1';const initial={level:'C1',saved:[],completed:[],scores:0,article:0,category:'Alle',readMode:'news',notes:'',writing:'',attempts:0};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}}let tab='Lesen',picked=null,answered=false,selectedAnswer=-1,quizIndex=0,recognition=null;
const articles=[{title:'Künstliche Intelligenz und die Arbeitswelt',category:'Technologie',date:'Lerntext',source:'Redaktioneller Übungstext',link:'https://www.tagesschau.de/wissen/technologie/',text:'Künstliche Intelligenz verändert zunehmend die Arbeitswelt. Während einige Unternehmen ihre Produktivität steigern, befürchten Beschäftigte, dass bestimmte Tätigkeiten automatisiert werden könnten. Fachleute betonen jedoch, dass technologische Innovationen nicht zwangsläufig zum Verlust von Arbeitsplätzen führen müssen. Entscheidend sei vielmehr, ob Unternehmen in Weiterbildung investieren und ihre Mitarbeitenden auf neue Anforderungen vorbereiten. Darüber hinaus stellt sich die Frage, wie die wirtschaftlichen Vorteile gerecht verteilt werden können.',vocab:{'zunehmend':'increasingly','die Arbeitswelt':'the world of work','während':'while','die Produktivität':'productivity','steigern':'to increase','befürchten':'to fear','Beschäftigte':'employees','Tätigkeiten':'activities or tasks','automatisiert':'automated','zwangsläufig':'inevitably','der Verlust':'loss','entscheidend':'decisive','die Weiterbildung':'further training','die Anforderungen':'requirements','darüber hinaus':'furthermore','gerecht':'fairly','verteilt':'distributed'},q:'Was ist laut Text für den Umgang mit KI besonders wichtig?',options:['Alle neuen Technologien verbieten','In Weiterbildung investieren','Sämtliche Tätigkeiten automatisieren'],answer:1},
{title:'Die Energiewende zwischen Anspruch und Wirklichkeit',category:'Wirtschaft',date:'Lerntext',source:'Redaktioneller Übungstext',link:'https://www.tagesschau.de/wirtschaft/',text:'Die Energiewende gilt als eine der größten wirtschaftlichen Herausforderungen Deutschlands. Der Ausbau erneuerbarer Energien soll langfristig die Abhängigkeit von fossilen Brennstoffen verringern. Gleichzeitig müssen Stromnetze modernisiert und ausreichende Speicherkapazitäten geschaffen werden. Kritiker weisen darauf hin, dass hohe Investitionskosten insbesondere kleinere Unternehmen belasten könnten. Befürworter argumentieren dagegen, dass frühzeitige Investitionen die Wettbewerbsfähigkeit stärken und neue Arbeitsplätze schaffen.',vocab:{'die Energiewende':'energy transition','die Herausforderung':'challenge','der Ausbau':'expansion','erneuerbar':'renewable','langfristig':'in the long term','die Abhängigkeit':'dependence','verringern':'to reduce','gleichzeitig':'at the same time','ausreichend':'sufficient','die Speicherkapazität':'storage capacity','hinweisen auf':'to point out','die Investitionskosten':'investment costs','belasten':'to burden','die Wettbewerbsfähigkeit':'competitiveness','frühzeitig':'early'},q:'Welches Argument nennen Befürworter?',options:['Investitionen können Wettbewerbsfähigkeit stärken','Stromnetze müssen abgeschafft werden','Erneuerbare Energien sind verboten'],answer:0},
{title:'Demokratie und digitale Öffentlichkeit',category:'Politik',date:'Lerntext',source:'Redaktioneller Übungstext',link:'https://www.tagesschau.de/inland/',text:'Soziale Netzwerke beeinflussen zunehmend, wie politische Informationen verbreitet und wahrgenommen werden. Einerseits ermöglichen digitale Plattformen eine breite gesellschaftliche Beteiligung. Andererseits können irreführende Inhalte das Vertrauen in demokratische Institutionen untergraben. Medienkompetenz spielt deshalb eine zentrale Rolle. Wer Informationen kritisch überprüft und unterschiedliche Quellen berücksichtigt, kann fundiertere Entscheidungen treffen. Eine offene Debatte erfordert zudem die Bereitschaft, abweichende Meinungen sachlich zu diskutieren.',vocab:{'die Öffentlichkeit':'public sphere','beeinflussen':'to influence','verbreitet':'distributed','wahrgenommen':'perceived','einerseits':'on the one hand','die Beteiligung':'participation','andererseits':'on the other hand','irreführend':'misleading','untergraben':'to undermine','die Medienkompetenz':'media literacy','berücksichtigen':'to consider','fundiert':'well-founded','abweichend':'differing','sachlich':'objectively'},q:'Was hilft laut Text bei fundierten Entscheidungen?',options:['Nur eine Quelle verwenden','Informationen kritisch prüfen','Abweichende Meinungen vermeiden'],answer:1},
{title:'Personalisierte Medizin und Genomforschung',category:'Wissenschaft',date:'Lerntext',source:'Redaktioneller Übungstext',link:'https://www.deutschlandfunk.de/wissenschaft-100.html',text:'Die personalisierte Medizin verfolgt das Ziel, Therapien stärker an individuelle biologische Merkmale anzupassen. Durch die Analyse genetischer Daten lassen sich bei bestimmten Erkrankungen mögliche Behandlungsansätze identifizieren. Allerdings werfen solche Verfahren auch ethische und datenschutzrechtliche Fragen auf. Insbesondere muss gewährleistet werden, dass sensible Gesundheitsdaten geschützt bleiben. Zudem ist entscheidend, ob neue diagnostische Möglichkeiten allen Patientinnen und Patienten gleichermaßen zugänglich sind.',vocab:{'die personalisierte Medizin':'personalized medicine','verfolgen':'to pursue','das Merkmal':'characteristic','anpassen':'to adapt','die Erkrankung':'disease','der Behandlungsansatz':'treatment approach','allerdings':'however','das Verfahren':'procedure','gewährleisten':'to ensure','sensibel':'sensitive','der Datenschutz':'data protection','gleichermaßen':'equally','zugänglich':'accessible'},q:'Welche zusätzliche Herausforderung wird angesprochen?',options:['Datenschutz und gerechter Zugang','Ein Verbot genetischer Forschung','Der Ersatz aller Ärzte'],answer:0}];
const topics=['Lesen','Vokabeln','Schreiben','Sprechen','Grammatik','Fortschritt'];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern ist in diesem Browser nicht möglich. Bitte exportiere deine Daten.')}}function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('levelBadge').textContent=state.level;document.getElementById('readCount').textContent=state.completed.length;document.getElementById('wordCount').textContent=state.saved.length;document.getElementById('scoreCount').textContent=state.scores;document.getElementById('nav').innerHTML=topics.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let main=document.getElementById('main');if(tab==='Lesen')reading(main);if(tab==='Vokabeln')vocabulary(main);if(tab==='Schreiben')writing(main);if(tab==='Sprechen')speaking(main);if(tab==='Grammatik')grammar(main);if(tab==='Fortschritt')progress(main)}
const feeds=[{name:'Deutschland & Politik',category:'Politik',url:'https://www.tagesschau.de/xml/rss2/'},{name:'Wirtschaft',category:'Wirtschaft',url:'https://www.tagesschau.de/wirtschaft/index~rss2.xml'},{name:'Wissenschaft & Technik',category:'Wissenschaft',url:'https://www.tagesschau.de/wissen/index~rss2.xml'},{name:'Internationale Nachrichten',category:'International',url:'https://www.deutschlandfunk.de/nachrichten-100.rss'}];let liveNews=[],newsStatus='Noch nicht geladen',newsLoading=false,newsSelected=null,newsChecked=0,newsPicked='',newsMeaning='',newsQuizAnswer='';
function stripMarkup(html){let d=new DOMParser().parseFromString(html||'','text/html');return (d.body.textContent||'').replace(/\s+/g,' ').trim()}
function newsDate(x){let d=new Date(x);return Number.isNaN(+d)?'Datum unbekannt':d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
async function loadNews(force=false){if(newsLoading)return;let cached;try{cached=JSON.parse(localStorage.getItem('deutsch-news-cache')||'null')}catch{}if(!force&&cached&&Date.now()-cached.time<86400000&&cached.items?.length){liveNews=cached.items;newsChecked=cached.time;newsStatus='Gespeicherte Nachrichten vom '+new Date(newsChecked).toLocaleString('de-DE');if(tab==='Lesen')render();return}newsLoading=true;newsStatus='Aktuelle Nachrichten werden geladen ...';if(tab==='Lesen')render();let found=[];for(const feed of feeds){try{const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(feed.url);let res=await fetch(proxy,{signal:AbortSignal.timeout(8500)});if(!res.ok)throw Error('HTTP '+res.status);let xml=new DOMParser().parseFromString(await res.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('RSS-Format');for(const item of [...xml.querySelectorAll('item')].slice(0,12)){let title=item.querySelector('title')?.textContent?.trim(),link=item.querySelector('link')?.textContent?.trim(),description=stripMarkup(item.querySelector('description')?.textContent||''),date=item.querySelector('pubDate')?.textContent;if(title&&/^https?:\/\//.test(link||'')){found.push({title,link,description,date,category:feed.category,source:feed.name,id:link})}}}catch(e){console.warn('Feed not available:',feed.name,e)}}liveNews=found.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,45);newsChecked=Date.now();newsStatus=liveNews.length?`${liveNews.length} echte Nachrichten geladen · ${new Date(newsChecked).toLocaleString('de-DE')}`:'Live-Nachrichten konnten nicht geladen werden. Bitte Internetverbindung prüfen oder Originalquellen öffnen.';if(liveNews.length){try{localStorage.setItem('deutsch-news-cache',JSON.stringify({time:newsChecked,items:liveNews}))}catch{}}else if(cached?.items?.length){liveNews=cached.items;newsStatus='Live-Aktualisierung fehlgeschlagen · letzter gespeicherter Stand'}newsLoading=false;if(tab==='Lesen')render()}
function reading(root){const isLive=state.readMode!=='stories';const a=articles[state.article]||articles[0];let n=liveNews.find(x=>x.id===newsSelected)||liveNews[0];root.innerHTML=`<div class="grid"><section class="panel"><h2>Lesen · Nachrichten & Geschichten</h2><div class="row"><button id="liveMode" class="${isLive?'primary':''}">📰 Aktuelle Nachrichten</button><button id="storyMode" class="${!isLive?'primary':''}">📖 Lerngeschichten</button></div><label for="level">Sprachniveau</label><select id="level" class="field"><option>B2</option><option>C1</option></select>${isLive?`<p class="muted">Originalnachrichten aus RSS-Feeds. Täglich neu abrufbar. Die Kurztexte stammen aus den veröffentlichten Meldungen und sind keine erfundenen Nachrichten.</p><div class="row"><button id="refreshNews" class="primary" ${newsLoading?'disabled':''}>↻ Jetzt aktualisieren</button></div><p class="muted" aria-live="polite">${escapeHtml(newsStatus)}</p><label for="category">Thema</label><select class="field" id="category">${['Alle','Politik','Wirtschaft','Wissenschaft','International'].map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select><div class="articles">${liveNews.filter(v=>state.category==='Alle'||v.category===state.category).map(v=>`<button class="articleBtn ${n?.id===v.id?'active':''}" data-news="${escapeHtml(v.id)}"><strong>${escapeHtml(v.title)}</strong><small>${escapeHtml(v.category)} · ${newsDate(v.date)}</small></button>`).join('')||'<p class="muted">Keine Artikel in dieser Kategorie geladen.</p>'}</div><div class="note"><b>Direkt zu den Nachrichten</b><p><a href="https://www.tagesschau.de/" target="_blank" rel="noopener">Tagesschau</a> · <a href="https://www.deutschlandfunk.de/" target="_blank" rel="noopener">Deutschlandfunk</a> · <a href="https://www.dw.com/de/" target="_blank" rel="noopener">Deutsche Welle</a></p></div>`:`<label for="category">Thema</label><select id="category" class="field">${['Alle','Technologie','Wirtschaft','Politik','Wissenschaft'].map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select><p class="muted">Vier didaktische Lerngeschichten</p><div class="articles">${articles.map((v,i)=>state.category==='Alle'||v.category===state.category?`<button class="articleBtn ${state.article===i?'active':''}" data-article="${i}"><strong>${escapeHtml(v.title)}</strong><small>${v.category} · ${state.completed.includes(i)?'✓ Abgeschlossen':'Noch offen'}</small></button>`:'').join('')}</div>`}</section><section class="panel" id="readingContent"></section></div>`;
document.getElementById('level').value=state.level;document.getElementById('level').onchange=e=>{state.level=e.target.value;save();render()};document.getElementById('liveMode').onclick=()=>{state.readMode='news';state.category='Alle';save();render();if(!liveNews.length)loadNews()};document.getElementById('storyMode').onclick=()=>{state.readMode='stories';state.category='Alle';save();render()};document.getElementById('category').onchange=e=>{state.category=e.target.value;save();render()};if(isLive){document.getElementById('refreshNews').onclick=()=>loadNews(true);document.querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>{newsSelected=b.dataset.news;newsPicked='';newsMeaning='';render()});if(!liveNews.length&&!newsLoading)setTimeout(()=>loadNews(),0);renderNewsArticle(n);return}
document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>{state.article=Number(b.dataset.article);picked=null;answered=false;save();render()});let root2=document.getElementById('readingContent');root2.innerHTML=`<div class="row between"><span class="tag">${a.category}</span><span class="tag">${state.level}</span></div><h2>${escapeHtml(a.title)}</h2><p class="muted">${a.source} · ${a.date}</p><div class="note">Tippe auf ein unterstrichenes Wort, um seine Bedeutung zu sehen.</div><div class="reader" id="reader"></div><div id="dictionary"></div><div class="row"><button id="speakArticle">🔊 Vorlesen</button><button id="stopSpeech">■ Stopp</button><a href="${a.link}" target="_blank" rel="noopener">Themenquelle öffnen ↗</a></div><div class="question"><h3>Leseverständnis</h3><p>${a.q}</p><div id="options">${a.options.map((o,i)=>`<button class="option" data-option="${i}">${escapeHtml(o)}</button>`).join('')}</div><p id="result" aria-live="polite"></p><button id="complete" class="primary" disabled>Lektion abschließen</button></div>`;const entries=Object.keys(a.vocab).sort((x,y)=>y.length-x.length),regex=new RegExp('('+entries.map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');document.getElementById('reader').innerHTML=a.text.split(regex).map(s=>{let k=entries.find(x=>x.toLowerCase()===s.toLowerCase());return k?`<button class="word" data-word="${escapeHtml(k)}">${escapeHtml(s)}</button>`:escapeHtml(s)}).join('');document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{picked=b.dataset.word;document.getElementById('dictionary').innerHTML=`<div class="dict"><strong>${escapeHtml(picked)}</strong><p>${escapeHtml(a.vocab[picked])}</p><button id="saveWord" class="primary">${state.saved.some(v=>v.word===picked)?'✓ Gespeichert':'+ Vokabel speichern'}</button></div>`;document.getElementById('saveWord').onclick=()=>{if(!state.saved.some(v=>v.word===picked)){state.saved.push({word:picked,meaning:a.vocab[picked]});save();document.getElementById('saveWord').textContent='✓ Gespeichert';document.getElementById('wordCount').textContent=state.saved.length}}});document.getElementById('speakArticle').onclick=()=>speak(a.text);document.getElementById('stopSpeech').onclick=()=>speechSynthesis.cancel();document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{let good=Number(b.dataset.option)===a.answer;document.getElementById('result').innerHTML=good?'<span class="correct">✓ Richtig! Sehr gut.</span>':'<span class="wrong">Noch nicht richtig. Versuch es erneut.</span>';if(good&&!answered){state.scores++;answered=true;save();document.getElementById('scoreCount').textContent=state.scores}document.getElementById('complete').disabled=!good});document.getElementById('complete').onclick=()=>{if(!state.completed.includes(state.article)){state.completed.push(state.article);save()}render()}}
function renderNewsArticle(n){let root=document.getElementById('readingContent');if(!n){root.innerHTML='<h2>Aktuelle Nachrichten</h2><p>Nachrichten werden geladen. Falls keine Meldungen erscheinen, kannst du die Originalquellen links öffnen.</p>';return}let summary=n.description||'Für diese Meldung liegt kein Kurztext im Nachrichtenfeed vor. Öffne den vollständigen Originalartikel.';root.innerHTML=`<span class="tag">${escapeHtml(n.category)}</span><span class="tag">${state.level}</span><h2>${escapeHtml(n.title)}</h2><p class="muted">${escapeHtml(n.source)} · ${newsDate(n.date)}</p><div class="note"><b>Originalmeldung</b><p>Der folgende Text ist die Kurzbeschreibung aus dem Nachrichtenfeed. Der vollständige Artikel öffnet sich beim Verlag.</p></div><div class="reader" id="newsReader">${escapeHtml(summary)}</div><p class="muted">Markiere ein Wort im Kurztext und tippe auf „Wort übersetzen“.</p><div class="row"><button id="translateSelection">🔎 Wort übersetzen</button><button id="readNews">🔊 Vorlesen</button><button id="stopNews">■ Stopp</button></div><div id="newsDictionary" class="dict hidden"></div><p><a href="${escapeHtml(n.link)}" target="_blank" rel="noopener noreferrer">Vollständigen Originalartikel lesen ↗</a></p><div class="question"><h3>Leseverständnis · ${state.level}</h3><p>Fasse die wichtigste Aussage der Meldung in zwei bis drei deutschen Sätzen zusammen. Welche Folgen könnte diese Entwicklung haben?</p><textarea id="newsAnswer" class="field" placeholder="Der Artikel berichtet darüber, dass ..."></textarea><div class="row"><button id="checkNewsAnswer" class="primary">Antwort prüfen</button><button id="saveNewsRead">✓ Als gelesen markieren</button></div><p id="newsFeedback" class="muted"></p></div>`;document.getElementById('readNews').onclick=()=>speak(n.title+'. '+summary);document.getElementById('stopNews').onclick=()=>speechSynthesis.cancel();document.getElementById('translateSelection').onclick=async()=>{let selection=window.getSelection()?.toString().trim().replace(/\s+/g,' ').slice(0,90)||newsPicked;if(!selection){alert('Markiere zuerst ein Wort oder einen kurzen Ausdruck im Nachrichtentext.');return}newsPicked=selection;let d=document.getElementById('newsDictionary');d.classList.remove('hidden');d.textContent='Übersetzung wird geladen ...';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(selection)+'&langpair=de|en',{signal:AbortSignal.timeout(7000)});let j=await r.json();newsMeaning=j.responseData?.translatedText||'';if(!newsMeaning)throw Error('Keine Übersetzung');d.innerHTML=`<b>${escapeHtml(selection)}</b><p>${escapeHtml(newsMeaning)}</p><button id="saveNewsWord" class="primary">+ Vokabel speichern</button>`;document.getElementById('saveNewsWord').onclick=()=>{if(!state.saved.some(v=>v.word===selection)){state.saved.push({word:selection,meaning:newsMeaning});save();document.getElementById('wordCount').textContent=state.saved.length}document.getElementById('saveNewsWord').textContent='✓ Gespeichert'}}catch{d.textContent='Übersetzung derzeit nicht verfügbar. Bitte später erneut versuchen.'}};document.getElementById('checkNewsAnswer').onclick=()=>{let t=document.getElementById('newsAnswer').value.trim(),wc=t.split(/\s+/).filter(Boolean).length;document.getElementById('newsFeedback').textContent=wc<20?'Schreibe bitte mindestens 20 Wörter. Beschreibe das Ereignis und eine mögliche Folge.':'Gut, du hast '+wc+' Wörter geschrieben. Prüfe, ob du die Kernaussage korrekt wiedergibst und deine Schlussfolgerung begründest. Eine automatische inhaltliche Bewertung benötigt einen KI-Dienst.'};document.getElementById('saveNewsRead').onclick=()=>{let key='news:'+n.id;if(!state.completed.includes(key)){state.completed.push(key);save();document.getElementById('readCount').textContent=state.completed.length}document.getElementById('newsFeedback').textContent='✓ Nachricht als gelesen gespeichert.'}}
function vocabulary(root){root.innerHTML=`<section class="panel"><h2>Meine Vokabeln</h2><p class="muted">Gespeicherte Wörter bleiben auf diesem Gerät erhalten.</p><div id="words">${state.saved.length?state.saved.map((v,i)=>`<div class="vocab"><div><b>${escapeHtml(v.word)}</b><div class="muted">${escapeHtml(v.meaning)}</div></div><button data-remove="${i}">Entfernen</button></div>`).join(''):'Noch keine Wörter gespeichert. Öffne einen Lesetext und tippe auf ein Wort.'}</div><div class="row" style="margin-top:15px"><button id="copyWords">Vokabeln kopieren</button><button id="testWords" class="primary" ${!state.saved.length?'disabled':''}>Karteikarten üben</button></div><div id="flashcard"></div></section>`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.saved.splice(Number(b.dataset.remove),1);save();render()});document.getElementById('copyWords').onclick=()=>navigator.clipboard?.writeText(state.saved.map(v=>v.word+' — '+v.meaning).join('\n')).then(()=>alert('Kopiert')).catch(()=>alert('Kopieren nicht verfügbar'));document.getElementById('testWords').onclick=()=>{let v=state.saved[Math.floor(Math.random()*state.saved.length)];document.getElementById('flashcard').innerHTML=`<div class="question"><h3>${escapeHtml(v.word)}</h3><button id="reveal">Bedeutung zeigen</button><p id="meaning"></p><button id="nextCard">Nächste Karte</button></div>`;document.getElementById('reveal').onclick=()=>document.getElementById('meaning').textContent=v.meaning;document.getElementById('nextCard').onclick=()=>document.getElementById('testWords').click()}}
function writing(root){root.innerHTML=`<section class="panel"><h2>Schreiben</h2><p>Schreibe einen kurzen Text auf Deutsch. Übe zum Beispiel: <b>Welche Chancen und Risiken bringt künstliche Intelligenz für die Forschung?</b></p><textarea class="field" id="writingText" placeholder="Meiner Meinung nach ...">${escapeHtml(state.writing)}</textarea><div class="row" style="margin-top:10px"><button id="checkWriting" class="primary">Text überprüfen</button><button id="copyPrompt">Für ausführliche KI-Korrektur kopieren</button></div><div id="feedback" class="note" aria-live="polite">Die lokale Prüfung erkennt einige häufige Fehler. Für vollständige grammatische Korrekturen ist ein KI-Dienst erforderlich.</div></section>`;let input=document.getElementById('writingText');input.oninput=()=>{state.writing=input.value;save()};document.getElementById('checkWriting').onclick=()=>{let s=input.value;let checks=[[/\bich habe gestern (?:gehe|gehen)\b/gi,'Nach „habe“ steht hier ein Partizip II: „ich bin gestern gegangen“.'],[/\bwegen dem\b/gi,'Im formellen Deutsch häufig: „wegen des“ + Genitiv.'],[/\bich bin interessiert für\b/gi,'Üblicherweise: „ich interessiere mich für“ oder „ich bin an ... interessiert“.'],[/\bseit (?:zwei|drei|vier) (?:Jahr|Monat)\b/gi,'Nach „seit“ steht der Dativ, z. B. „seit zwei Jahren“.'],[/\bich möchte zu (?:lernen|arbeiten)\b/gi,'Nach „möchte“ steht normalerweise der Infinitiv ohne „zu“.']];let hits=checks.filter(([re])=>re.test(s)).map(x=>'• '+x[1]);let n=(s.trim().match(/\S+/g)||[]).length;document.getElementById('feedback').textContent=`Wörter: ${n}. ${n<40?'Versuche mindestens 40 Wörter zu schreiben.':'Gute Textlänge für eine kurze Übung.'}\n${hits.length?hits.join('\n'):'Keine der hinterlegten typischen Fehlerformen gefunden. Das bedeutet nicht, dass der Text vollständig fehlerfrei ist.'}`};document.getElementById('copyPrompt').onclick=()=>{let p='Korrigiere meinen deutschen Text auf C1-Niveau. Zeige die korrigierte Fassung, erkläre meine Fehler und gib drei gezielte Übungen:\n\n'+input.value;navigator.clipboard?.writeText(p).then(()=>alert('Prompt kopiert. In ChatGPT einfügen.')).catch(()=>alert('Kopieren nicht verfügbar.'))}}
function speak(t){if(!('speechSynthesis'in window)){alert('Sprachausgabe wird von diesem Browser nicht unterstützt.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)}function speaking(root){root.innerHTML=`<section class="panel"><h2>Sprechen</h2><p>Sprich über dieses Thema: <b>Wie verändert die Digitalisierung unseren Alltag?</b></p><div class="row"><button id="listen" class="primary">🎙 Aufnahme starten</button><button id="stopListening">■ Stoppen</button><button id="playExample">🔊 Beispielsatz hören</button></div><label for="transcript">Erkannter Text</label><textarea id="transcript" class="field" placeholder="Deine Sprache wird hier angezeigt ..."></textarea><div id="speechStatus" class="note">Spracherkennung hängt vom Browser, Mikrofonzugriff und gegebenenfalls einer Internetverbindung ab. Sie ist nicht in jedem Browser verfügbar.</div></section>`;document.getElementById('playExample').onclick=()=>speak('Die Digitalisierung bietet zahlreiche Chancen, stellt die Gesellschaft jedoch auch vor neue Herausforderungen.');document.getElementById('listen').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('speechStatus').textContent='Dieser Browser unterstützt die Spracherkennung nicht. Versuche Chrome auf Android oder nutze die Texteingabe.';return}try{recognition=new SR();recognition.lang='de-DE';recognition.continuous=true;recognition.interimResults=true;let final='';recognition.onresult=e=>{let partial='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else partial+=e.results[i][0].transcript}document.getElementById('transcript').value=final+partial};recognition.onerror=e=>document.getElementById('speechStatus').textContent='Spracherkennung: '+e.error;recognition.start();document.getElementById('speechStatus').textContent='Aufnahme läuft ...'}catch(e){document.getElementById('speechStatus').textContent=String(e)}};document.getElementById('stopListening').onclick=()=>{recognition?.stop();document.getElementById('speechStatus').textContent='Aufnahme beendet.'}}
const exercises=[{q:'Wenn ich mehr Zeit ___, würde ich jeden Tag Deutsch üben.',opts:['habe','hätte','hatte'],answer:1,why:'Konjunktiv II: „Wenn ich mehr Zeit hätte, würde ich ...“'},{q:'Die Studie, ___ Ergebnisse veröffentlicht wurden, ist sehr relevant.',opts:['deren','dessen','denen'],answer:0,why:'Genitiv-Relativpronomen für „die Studie“: deren.'},{q:'Die Daten ___ gestern ausgewertet.',opts:['wurden','werden sein','hat'],answer:0,why:'Präteritum Passiv: wurden + Partizip II.'},{q:'Trotz ___ hohen Kosten wurde das Projekt fortgesetzt.',opts:['die','der','den'],answer:1,why:'„Trotz“ steht im Standarddeutsch mit Genitiv: trotz der hohen Kosten.'},{q:'Er behauptet, er ___ die Ergebnisse bereits überprüft.',opts:['habe','hatte sein','wären'],answer:0,why:'Indirekte Rede im Konjunktiv I: er habe überprüft.'}];function grammar(root){let e=exercises[quizIndex%exercises.length];root.innerHTML=`<section class="panel"><h2>Grammatiktrainer</h2><p class="muted">Konjunktiv II · Relativsätze · Passiv · Genitiv · indirekte Rede</p><span class="tag">Aufgabe ${quizIndex%exercises.length+1} von ${exercises.length}</span><div class="question"><h3>${e.q}</h3>${e.opts.map((o,i)=>`<button class="option" data-grammar="${i}">${o}</button>`).join('')}<p id="grammarFeedback" aria-live="polite"></p><button id="nextGrammar" class="primary" disabled>Nächste Aufgabe</button></div></section>`;document.querySelectorAll('[data-grammar]').forEach(b=>b.onclick=()=>{let good=Number(b.dataset.grammar)===e.answer;document.getElementById('grammarFeedback').innerHTML=`<span class="${good?'correct':'wrong'}">${good?'✓ Richtig!':'Nicht ganz.'}</span> ${e.why}`;document.getElementById('nextGrammar').disabled=false;document.querySelectorAll('[data-grammar]').forEach(x=>x.disabled=true);state.attempts++;if(good)state.scores++;save();document.getElementById('scoreCount').textContent=state.scores});document.getElementById('nextGrammar').onclick=()=>{quizIndex++;render()}}
function progress(root){root.innerHTML=`<section class="panel"><h2>Mein Lernfortschritt</h2><p><b>${state.completed.length} / ${articles.length}</b> Lesetexte abgeschlossen</p><progress value="${state.completed.length}" max="${articles.length}" style="width:100%"></progress><p><b>${state.saved.length}</b> Vokabeln gespeichert · <b>${state.scores}</b> richtige Antworten</p><label for="notes">Meine Lernnotizen</label><textarea class="field" id="notes" placeholder="Was möchte ich morgen wiederholen?">${escapeHtml(state.notes)}</textarea><h3>Datensicherung</h3><p class="muted">Exportiere deine Daten, um sie auf ein anderes Gerät zu übertragen oder vor dem Löschen von Browserdaten zu sichern.</p><div class="row"><button id="export" class="primary">Daten exportieren</button><label for="import" style="margin:0"><span class="tag">Daten importieren</span></label><input type="file" id="import" accept="application/json" style="max-width:180px"><button id="reset">Fortschritt zurücksetzen</button></div></section>`;document.getElementById('notes').oninput=e=>{state.notes=e.target.value;save()};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutsch-lernen-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.saved)||!Array.isArray(d.completed))throw Error('Ungültige Sicherungsdatei');state={...initial,...d};save();render();alert('Daten importiert.')}catch{alert('Diese Datei konnte nicht importiert werden.')}};document.getElementById('reset').onclick=()=>{if(confirm('Wirklich alle lokalen Lerndaten löschen?')){state={...initial};save();render()}}}
render();
</script></body></html>
